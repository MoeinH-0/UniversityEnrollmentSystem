spring:
  application:
    name: UniversityEnrollmentSystem

  datasource:
    url: jdbc:postgresql://localhost/university_enrollment
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha